ShortDescription: Code context engine for AI coding agents
Description: |-
  Hyponoia is a native MCP server distributed as a verified runtime
  set. The portable archive keeps its authenticated release-owned assets with the
  executable registered by WinGet. It indexes codebases at extreme speed and
  exposes 16 MCP tools for AI coding agents. Full indexes an average repository
  in milliseconds, the Linux kernel (28M LOC) in 3 minutes. Supports 158 languages
  via vendored tree-sitter grammars. No hosted service or API key. Plug and play
  across 43 agent surfaces including Claude Code, Codex CLI, and Zed.
