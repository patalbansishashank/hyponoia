# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json

PackageIdentifier: patalbansishashank.Hyponoia
PackageVersion: 0.3.1
InstallerLocale: en-US
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: hyponoia.exe
    PortableCommandAlias: hyponoia
# Windows.Desktop only. Windows.Universal claimed a UWP/MSIX app package, which
# a zip of a native console executable is not — the schema accepts the value,
# and the platform it names cannot run this.
Platform:
  - Windows.Desktop
ReleaseDate: 2026-08-16
# InstallerSha256 is v0.3.1's own, copied from the release's checksums.txt and
# verified independently by re-hashing the downloaded zip. On a version bump it
# is zeroed again until the new release exists: a real hash for the wrong tag
# fails at install time with a mismatch nobody can attribute to a cause.
# The build publishes only the UI variant, so this is the only archive that exists.
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/patalbansishashank/hyponoia/releases/download/v0.3.1/hyponoia-ui-windows-amd64.zip
    InstallerSha256: "fee50ab1a80ca00b133311d96d90447b0b991ec66892aaa0a0e0ef2d2753c4fe"
ManifestType: installer
ManifestVersion: 1.6.0
