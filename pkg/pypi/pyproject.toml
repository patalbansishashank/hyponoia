[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyponoia"
version = "0.8.1"
description = "Code context engine for AI coding agents — indexes repositories into a queryable graph and returns exact code spans instead of whole files"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["mcp", "claude", "code-intelligence", "codebase", "memory", "ai", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/patalbansishashank/hyponoia"
Repository = "https://github.com/patalbansishashank/hyponoia"
Issues = "https://github.com/patalbansishashank/hyponoia/issues"

[project.scripts]
hyponoia = "hyponoia:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hyponoia"]
