# The full cross-platform test matrix, on a schedule.
#
# NEXT-STEPS.md §2.14. This workflow exists because of a measured gap, not a
# preference. `ci.yml` runs `test-foundation` — 301 tests, one runner, on every
# push. The full suite is roughly 6,610 tests, and until now it ran ONLY inside
# `dry-run.yml` or `release.yml`, both of which are `workflow_dispatch`-only.
# Nothing ran it unless a human asked. (It spanned ten platforms when this was
# written; macOS and ARM64 Windows have since been retired — see
# docs/MAINTAINERS.md "Retired platforms" — which changes the width of the
# matrix, not the argument for giving it a venue.)
#
# What that cost: the suite was failing for five months and nobody could have
# known. When §2.13 finally ran it, every surviving failure dated to
# 2026-03-15 through 2026-08-09 — drift that accumulated entirely inside the
# window where no venue was looking. A gate that only runs when you are already
# shipping tells you about breakage at the worst possible moment.
#
# The cost argument that justified the asymmetry died when the repository went
# public: the full matrix is free now. So the suite gets a venue that runs
# whether or not anyone remembers to ask.
#
# Cadence is weekly, deliberately. Weekly bounds undetected drift at seven days
# against the five months it actually reached — and `dry-run.yml` remains the
# on-demand venue for "before I ship", which is the case where you want the
# answer now rather than on Monday. Daily would cost seven times the runner
# time to shorten an already-bounded window, on a project whose push volume
# does not justify it.
#
# NOTE: GitHub disables scheduled workflows in a public repository after 60
# days with no commit activity. If this repo goes quiet, this venue goes quiet
# with it, and the dispatch trigger below is how you restart it.
name: Full Suite

on:
  # No automatic trigger -- same instruction as ci.yml. This is the one
  # with real prior cost recorded a few lines up (five months of drift
  # before §2.13 gave it a venue); noted once, not re-litigated. Runnable
  # by hand.
  workflow_dispatch:

permissions:
  contents: read

# Serialise, but never cancel. This venue exists to produce a complete failing
# set, and a cancelled run does not: it reports the first failure rather than
# the count, and leaves every unfinished job in a third state that is neither
# pass nor fail. §2.14 started from exactly that ambiguity, inherited from a
# run stopped at 36m30s. At a weekly cadence an overlap essentially cannot
# happen on its own; if a manual dispatch lands mid-run, the right outcome is
# that it waits, not that it destroys the answer already being computed.
concurrency:
  group: full-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Same reusable workflow, same inputs, as the release path — `broad_platforms`
  # and `shard_suites` are what make this the FULL matrix rather than the core
  # one. If these drift apart from release.yml, this venue stops being a
  # rehearsal for the thing that ships, which is its only reason to exist.
  test:
    uses: ./.github/workflows/_test.yml
    with:
      skip_perf: true
      broad_platforms: true
      shard_suites: true
