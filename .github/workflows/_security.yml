# Reusable: security-static + CodeQL gate.
# Runs independently from lint/test/build — does not block the main pipeline.
# Affects overall workflow success status.
name: Security Gate

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  security-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Layer 1: Static allow-list audit"
        run: scripts/security-audit.sh
      - name: "Layer 6: UI security audit"
        run: scripts/security-ui.sh
      - name: "Layer 8: Vendored dependency integrity"
        run: scripts/security-vendored.sh

  # license-gate (dependency-license compliance + provenance audit) removed:
  # this project isn't redistributed to anyone who'd need that guarantee.
  # scripts/license-gate.sh and scripts/audit-license-provenance.py still
  # exist and still work if that changes.

