# Reusable: build release binaries on all supported platforms
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string (e.g. v0.3.0)'
        type: string
        default: ''
      attest:
        description: 'Generate build provenance attestations for release artifacts'
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc
            cxx: g++
          # linux-arm64 removed: not a target anyone uses this on.
          # RETIRED-PLATFORM(macos): the darwin-arm64 (macos-14) and darwin-amd64
          # (macos-15-intel) legs were removed. They do not merely fail their
          # tests — the product does not COMPILE on the macos-latest images any
          # more (vendored llama.cpp against MacOSX26.sdk under -std=c11 hides
          # u_int; it wants _DARWIN_C_SOURCE), so these legs could not have
          # produced an artifact to ship even with every test passing.
          # macos-15-intel was GitHub's supported Intel image through Aug 2027;
          # that deadline still applies if the platform comes back.
          # See docs/MAINTAINERS.md "Retired platforms".
    runs-on: ${{ matrix.os }}
    # Every leg is BLOCKING — no continue-on-error. A missing artifact fails the
    # build loudly rather than silently publishing a release short one platform
    # (that is a user-reported gap, and it is how the Intel macOS binary went
    # missing once before).
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install deps (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Build release binary with UI
        env:
          VERSION: ${{ inputs.version }}
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          if [ -n "$VERSION" ]; then
            scripts/build.sh --with-ui --version "$VERSION" "CC=$CC" "CXX=$CXX"
          else
            scripts/build.sh --with-ui "CC=$CC" "CXX=$CXX"
          fi

      - name: Ad-hoc sign macOS release binary
        if: startsWith(matrix.os, 'macos')
        run: codesign --sign - --force build/c/hyponoia

      - name: Frontend integrity scan
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: scripts/security-ui.sh

      # Archive layout/name live in the ONE canonical script the local
      # artifact-flow smoke lane also runs (venue-parity contract).
      - name: Archive release binary (canonical package-release.sh)
        run: scripts/package-release.sh ${{ matrix.goos }} ${{ matrix.goarch }} --variant ui

      - name: Attest release binary provenance
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: hyponoia-ui-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "*.tar.gz"

  build-linux-portable:
    # Fully static Linux binaries (gcc -static on Ubuntu).
    # Runs on any Linux distro without shared library dependencies.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          # linux-arm64 removed: not a target anyone uses this on.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Build release binary with UI (static)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            scripts/build.sh --with-ui --version "$VERSION" CC=gcc CXX=g++ STATIC=1
          else
            scripts/build.sh --with-ui CC=gcc CXX=g++ STATIC=1
          fi

      - name: Verify release static linking
        run: |
          file build/c/hyponoia
          ldd build/c/hyponoia 2>&1 | grep -q "not a dynamic executable" || ldd build/c/hyponoia 2>&1 | grep -q "statically linked"

      - name: Archive release binary (canonical package-release.sh)
        run: scripts/package-release.sh linux ${{ matrix.arch }}-portable --variant ui

      - name: Attest release binary provenance
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: hyponoia-ui-linux-${{ matrix.arch }}-portable.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-linux-${{ matrix.arch }}-portable
          path: "*.tar.gz"

  build-linux-gpu:
    # The GPU (Vulkan) variant of the SAME UI build: HYP_ASK_GPU=vulkan, and
    # therefore STATIC=0 — Makefile.hyp refuses the pair, because the Vulkan
    # backend resolves libvulkan.so.1 through the system Vulkan loader + ICD at
    # RUNTIME, and a fully static binary cannot have one. This job therefore
    # ships a DYNAMICALLY LINKED binary (glibc + libvulkan.so.1) as a separate,
    # opt-in archive, hyponoia-ui-linux-amd64-gpu.tar.gz, NEXT TO the static
    # portable archive — never instead of it. The one-file/no-runtime-deps
    # promise belongs to build-linux-portable and is untouched here.
    #
    # Only the opt-in `hyponoia embed` / `ask` index pass is faster on this
    # variant (T2: 24.09 docs/s vs 1.581 CPU); the vectors are identical, so
    # a user who picks the wrong one loses time, not answers.
    #
    # Build-time deps come from apt, matching Makefile.hyp's system-path probe:
    #   libvulkan-dev  -> /usr/include/vulkan/vulkan.h + vulkan.hpp, -lvulkan
    #   spirv-headers  -> /usr/include/spirv/unified1/spirv.hpp
    #   glslc          -> the shader compiler gen-vulkan-shaders.sh drives
    # No GPU is needed to BUILD (shaders compile to SPIR-V offline); the
    # runner has none, so no runtime GPU smoke happens here.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install deps (Vulkan build-time toolchain)
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libvulkan-dev spirv-headers glslc
          command -v glslc
          test -f /usr/include/vulkan/vulkan.h
          test -f /usr/include/vulkan/vulkan.hpp
          test -f /usr/include/spirv/unified1/spirv.hpp

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Build release binary with UI (Vulkan GPU lane, dynamic)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            scripts/build.sh --with-ui --version "$VERSION" CC=gcc CXX=g++ HYP_ASK_GPU=vulkan STATIC=0
          else
            scripts/build.sh --with-ui CC=gcc CXX=g++ HYP_ASK_GPU=vulkan STATIC=0
          fi

      - name: Verify Vulkan linkage (dynamic; libvulkan.so.1 is a runtime dep by design)
        run: |
          file build/c/hyponoia
          ldd build/c/hyponoia
          # The property this variant exists for: it links the Vulkan loader.
          ldd build/c/hyponoia | grep -q 'libvulkan\.so\.1' \
            || { echo "gpu variant does not link libvulkan.so.1" >&2; exit 1; }
          # And the property it must NOT have: dlopen/dlsym stay out of the
          # image (the vendored ggml dynamic-backend loader is compiled out;
          # the Vulkan backend is linked in via -lvulkan, not dlopen'd). The
          # dynamic-symbol table of a dynamically linked ELF lists every
          # imported symbol; readelf is what the composition gate uses too.
          if readelf --dyn-syms --wide build/c/hyponoia | grep -Eq ' UND +(dlopen|dlsym)(@|$)'; then
            echo "gpu variant imports dlopen/dlsym" >&2; exit 1
          fi

      - name: Archive release binary (canonical package-release.sh)
        run: scripts/package-release.sh linux amd64-gpu --variant ui

      - name: Attest release binary provenance
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: hyponoia-ui-linux-amd64-gpu.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-linux-amd64-gpu
          path: "*.tar.gz"
