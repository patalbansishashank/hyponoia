# CI — the gate that actually runs on every change to main.
#
# There was no such gate before. `dry-run.yml` is workflow_dispatch only and had
# never fired once; `pr.yml` runs on pull requests, and this repository pushes
# to main directly. So the README's CI badge pointed at a workflow with no runs
# and was permanently grey. This is the workflow the badge names, and it fails
# when the build or the fast suite fails.
#
# Linux only, and deliberately: it is the platform whose green we can keep
# honest. Release artifacts for macOS and Windows are built by release.yml,
# which is where a cross-platform claim belongs.
name: CI

# NEXT-STEPS.md §2.12 added `feat/**`, and it closed a real hole rather than
# widening the net for its own sake. This workflow used to trigger on
# [main, dev] only. `feat/nano-local-and-escalation` is neither, so §2.10's five
# pushes produced five DCO runs and ZERO CI runs — the entire shipped nano lane
# was never built or tested by a runner, and would not have been even with the
# account in credit. That gap was ours, not inherited, and it was only visible
# by enumerating triggers against the branch names actually in use. This job is
# Linux-only and roughly two minutes warm, so covering feature branches is the
# cheapest gate in the repository.
#
# §2.14 re-ran that enumeration and found the hole was only two-thirds closed.
# The repository uses three prefixes, not one: `feat/**`, `chore/**` and
# `fix/**`. §2.13's own work landed on chore/ci-hygiene, chore/public-prep and
# chore/release-path-fixes — three branches that pushed repeatedly and got no
# CI run each time, for exactly the reason `feat/**` had been added. Listing the
# prefix you happen to be using fixes today's branch and leaves the next one
# uncovered; all three are listed now.
on:
  push:
    # integration is here because it is the branch that ACCUMULATES units, and
    # so the one whose combination nothing else builds. Unit branches match
    # feat/**; the branch that merges them matched nothing, and 82 commits ran
    # no workflow at all. Same shape as ci.yml once covering only [main, dev]
    # while a whole section's work sat on a feat/ branch.
    branches: [main, dev, integration, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main, dev, integration, 'feat/**', 'fix/**', 'chore/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # NEXT-STEPS.md §2.13. The control, as opposed to the pre-push hook, which is
  # only fast local feedback — hooks do not survive cloning and a fresh clone
  # has none. Runs in PARALLEL with build-and-test, so it costs no wall clock.
  #
  # It exists because the obvious version did not work: a live Voyage key sat in
  # tests/test_ask_provider.c from c2c5d065 until §2.13, and a scan of the
  # checked-out tree for `key = "..."` came back clean twice — the key was a
  # bare function argument, and the worktree is the wrong place to look anyway.
  secret-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole point is history; a shallow clone sees none of it

      # Proves DETECTION before proving cleanliness. A scanner nobody has
      # watched fail is indistinguishable from `exit 0`, and this one has a
      # real leak in its own history to prove itself against.
      - name: The scanner must still catch the key it was written for
        run: scripts/check-secret-history.sh --selftest

      - name: No unexplained vendor key anywhere in history
        run: scripts/check-secret-history.sh --all

  # NEXT-STEPS.md §3.2 step 6. The sibling of secret-history, and here for the
  # same reason it is: `pkg/go/hyponoia`, a 9,428,133-byte compiled Go binary,
  # was tracked from dd41cf92 and shipped inside two tags before anyone looked.
  # dd41cf92 was a direct push to main — the path this header describes — so
  # gating this on pull_request alone (pr.yml carries the same job) would have
  # missed the very commit that motivated it. Runs in PARALLEL with
  # build-and-test, so it costs no wall clock.
  tracked-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Detection before cleanliness, exactly as secret-history does it above.
      - name: The gate must refuse planted binaries
        run: scripts/ci/check-tracked-artifacts.sh --selftest

      - name: No tracked file may be a build artifact
        run: scripts/ci/check-tracked-artifacts.sh

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev ccache

      # This workflow is now the only thing that warms the compiler cache. The
      # nightly cache-warm matrix was removed: it ran five runners a day —
      # including two macOS, billed at 10x on a private repository — and had
      # been failing since the ask lane broke the build, so it spent minutes
      # nightly to prove nothing.
      - name: Compiler cache (restore)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ci-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ci-ccache-${{ runner.os }}-
            ccache-${{ runner.os }}-

      - name: Build the product binary
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1500M
        run: |
          source scripts/env.sh
          make -j"$(nproc)" -f Makefile.hyp hyp

      # The `ask` lane's encoder is compiled in but never loaded here: no model
      # is on the runner, and the tool reports available=false rather than
      # failing. That is the behaviour worth having in CI — the binary must
      # build and start on a machine with no weights.
      - name: Version and help must work with no model present
        run: |
          ./build/c/hyponoia --version
          ./build/c/hyponoia --help > /dev/null
          ./build/c/hyponoia fetch-model --path

      # Documented counts must match the binary. The tool count had drifted to
      # four different values across seven files before this existed.
      - name: Documentation claims match the binary
        run: scripts/check-docs-claims.sh

      - name: Build and run the fast suite
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1500M
        run: |
          source scripts/env.sh
          make -j"$(nproc)" -f Makefile.hyp test-foundation
          ./build/c/test-foundation

      - name: Compiler cache (save)
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ci-ccache-${{ runner.os }}-${{ github.sha }}

  # ══════════════════════════════════════════════════════════════════
  # HYPMEASURE-TEMP — TEMPORARY. REVERT BEFORE MERGE.
  #
  # HYP_EXTRACT_BUDGET is a per-file wall-clock timeout, and on the slowest
  # supported runner ordinary source files exceed it: the parse aborts, the
  # file contributes zero definitions, and the run still reports success. A
  # timeout teaches only "longer than the budget", so this job runs the same
  # suite with the budget raised far past any plausible parse and with the
  # extractor emitting one line per parse. That is the distribution the
  # shipped constant is set from. Four legs so the two variables that move it
  # — instruction set and sanitizer instrumentation — are separated rather
  # than confounded.
  # ══════════════════════════════════════════════════════════════════
  budget-measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            sanitize: 'asan-ubsan'
          - os: ubuntu-24.04-arm
            sanitize: 'none'
          - os: ubuntu-latest
            sanitize: 'asan-ubsan'
          - os: ubuntu-latest
            sanitize: 'none'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # g1_replay rebuilds this repository's tree at real commits; a
          # shallow clone cannot do it and the suite refuses rather than
          # reporting green. Same reason _test.yml pays this cost.
          fetch-depth: 0

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev ccache

      - name: Report the runner this measurement is anchored to
        run: |
          echo "leg=${{ matrix.os }} sanitize=${{ matrix.sanitize }}"
          nproc
          uname -m
          grep -m1 'model name' /proc/cpuinfo || grep -m1 'Model' /proc/cpuinfo || true
          free -m | head -2

      - name: Index the g1 corpus with every parse allowed to finish
        run: |
          set -o pipefail
          rc=0
          if [ "${{ matrix.sanitize }}" = "none" ]; then
            # NOT `SANITIZE=`. That mode is documented in test.sh --help and
            # does not compile on gcc, x86 or arm: a test deliberately frees a
            # poisoned sentinel pointer to prove the callee overwrote it, and
            # -Wfree-nonheap-object sees it only when ASan is NOT instrumenting
            # the same function. So the only build anyone runs is the sanitized
            # one, and the plain one has been red without a venue to notice.
            # One demotion buys the uninstrumented parse timings; keeping the
            # flag non-empty leaves HYP_SANITIZED_BUILD defined, which reaches
            # only thread-stack floors and two bench asserts, none in this
            # suite, and no instrumentation.
            scripts/test.sh --suites g1_replay BUILD_DIR=build/measure \
              "SANITIZE=-fno-omit-frame-pointer -Wno-error=free-nonheap-object" \
              > measure.out 2> measure.err || rc=$?
          else
            scripts/test.sh --suites g1_replay BUILD_DIR=build/measure \
              > measure.out 2> measure.err || rc=$?
          fi
          echo "suite rc=$rc"
          tail -60 measure.out

      - name: The distribution, slowest first
        if: always()
        run: |
          echo "── every parse over the 20 ms floor, slowest first ──"
          grep '^HYPMEASURE' measure.err \
            | sed 's/HYPMEASURE //' \
            | sort -t' ' -k2.4 -rn \
            | head -40 || echo "(no HYPMEASURE lines — instrumentation missing?)"
          echo "── count ──"
          grep -c '^HYPMEASURE' measure.err || true
          echo "── any parse that still aborted ──"
          grep '^HYPMEASURE' measure.err | grep 'aborted=1' || echo "(none — every parse ran to completion)"

      # The g1 corpus tops out at a 534 KB file, and that is not the largest
      # LEGITIMATE file the product is asked to parse. This repository vendors
      # a 9.4 MB sqlite3 amalgamation, and a user's repository has no
      # .hypignore keeping it out. Extrapolating its cost from the corpus would
      # be a plausible story where a measurement is available, so measure it:
      # the objects are already built, so this is one link away.
      - name: What the largest legitimate file in this tree costs here
        if: always()
        run: |
          set -x
          SAN="-fsanitize=address,undefined -fno-omit-frame-pointer"
          if [ "${{ matrix.sanitize }}" = "none" ]; then SAN="-fno-omit-frame-pointer"; fi
          cat > probe_parse.c <<'PROBE'
          #include "hyp.h"
          #include <stdio.h>
          #include <stdlib.h>
          #include <time.h>
          int main(int argc, char **argv) {
              for (int i = 1; i < argc; i++) {
                  FILE *f = fopen(argv[i], "rb");
                  if (!f) { fprintf(stderr, "open fail %s\n", argv[i]); continue; }
                  fseek(f, 0, SEEK_END); long n = ftell(f); fseek(f, 0, SEEK_SET);
                  char *buf = malloc((size_t)n + 1);
                  if (!buf) { fclose(f); continue; }
                  size_t got = fread(buf, 1, (size_t)n, f); buf[got] = 0; fclose(f);
                  struct timespec a, b;
                  clock_gettime(CLOCK_MONOTONIC, &a);
                  HYPFileResult *r = hyp_extract_file(buf, (int)got, HYP_LANG_C, "probe",
                                                      argv[i], (int64_t)3600 * 1000000,
                                                      NULL, NULL);
                  clock_gettime(CLOCK_MONOTONIC, &b);
                  double ms = (double)(b.tv_sec - a.tv_sec) * 1000.0
                            + (double)(b.tv_nsec - a.tv_nsec) / 1e6;
                  printf("PROBE %s bytes=%ld total_ms=%.1f defs=%d\n", argv[i], n, ms,
                         r ? r->defs.count : -1);
                  fflush(stdout);
                  if (r) hyp_free_result(r);
                  free(buf);
              }
              return 0;
          }
          PROBE
          FS=$(ls src/foundation/*.c | grep -v 'mem_override_posix.c\|mem_override_win.c' | tr '\n' ' ')
          gcc -std=c11 -D_DEFAULT_SOURCE -D_GNU_SOURCE -g -O1 -w \
            -Isrc -Ivendored -Ivendored/sqlite3 -Ivendored/mimalloc/include \
            -Iinternal/hyp -Iinternal/hyp/vendored/ts_runtime/include \
            -Ibuild/measure/generated $SAN -o probe_parse probe_parse.c \
            internal/hyp/hyp.c internal/hyp/extract_*.c internal/hyp/helpers.c \
            internal/hyp/lang_specs.c internal/hyp/macro_table.c \
            internal/hyp/iris_export_xml.c internal/hyp/service_patterns.c \
            $FS src/semantic/ast_profile.c src/simhash/minhash.c \
            vendored/yyjson/yyjson.c build/measure/mimalloc.o \
            build/measure/grammar_*.o build/measure/ts_runtime.o \
            build/measure/lsp_all.o build/measure/preprocessor.o \
            -lm -lstdc++ -lpthread -lz > probe_build.log 2>&1 \
            || { echo "probe link failed"; tail -20 probe_build.log; exit 0; }
          ASAN_OPTIONS=detect_leaks=0 ./probe_parse vendored/sqlite3/sqlite3.c \
            src/mcp/mcp.c > probe.out 2> probe.err || true
          cat probe.out
          grep '^HYPMEASURE' probe.err || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: budget-measure-${{ matrix.os }}-${{ matrix.sanitize }}
          path: |
            measure.out
            measure.err
            probe.out
            probe.err
          retention-days: 3
