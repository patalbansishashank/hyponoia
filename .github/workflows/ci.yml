# CI — the gate that actually runs on every change to main.
#
# There was no such gate before. `dry-run.yml` is workflow_dispatch only and had
# never fired once; `pr.yml` runs on pull requests, and this repository pushes
# to main directly. So the README's CI badge pointed at a workflow with no runs
# and was permanently grey. This is the workflow the badge names, and it fails
# when the build or the fast suite fails.
#
# Linux only, and deliberately: it is the platform whose green we can keep
# honest. Release artifacts for macOS and Windows are built by release.yml,
# which is where a cross-platform claim belongs.
name: CI

# NEXT-STEPS.md §2.12 added `feat/**`, and it closed a real hole rather than
# widening the net for its own sake. This workflow used to trigger on
# [main, dev] only. `feat/nano-local-and-escalation` is neither, so §2.10's five
# pushes produced five DCO runs and ZERO CI runs — the entire shipped nano lane
# was never built or tested by a runner, and would not have been even with the
# account in credit. That gap was ours, not inherited, and it was only visible
# by enumerating triggers against the branch names actually in use. This job is
# Linux-only and roughly two minutes warm, so covering feature branches is the
# cheapest gate in the repository.
#
# §2.14 re-ran that enumeration and found the hole was only two-thirds closed.
# The repository uses three prefixes, not one: `feat/**`, `chore/**` and
# `fix/**`. §2.13's own work landed on chore/ci-hygiene, chore/public-prep and
# chore/release-path-fixes — three branches that pushed repeatedly and got no
# CI run each time, for exactly the reason `feat/**` had been added. Listing the
# prefix you happen to be using fixes today's branch and leaves the next one
# uncovered; all three are listed now.
on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main, dev, 'feat/**', 'fix/**', 'chore/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # NEXT-STEPS.md §2.13. The control, as opposed to the pre-push hook, which is
  # only fast local feedback — hooks do not survive cloning and a fresh clone
  # has none. Runs in PARALLEL with build-and-test, so it costs no wall clock.
  #
  # It exists because the obvious version did not work: a live Voyage key sat in
  # tests/test_ask_provider.c from c2c5d065 until §2.13, and a scan of the
  # checked-out tree for `key = "..."` came back clean twice — the key was a
  # bare function argument, and the worktree is the wrong place to look anyway.
  secret-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole point is history; a shallow clone sees none of it

      # Proves DETECTION before proving cleanliness. A scanner nobody has
      # watched fail is indistinguishable from `exit 0`, and this one has a
      # real leak in its own history to prove itself against.
      - name: The scanner must still catch the key it was written for
        run: scripts/check-secret-history.sh --selftest

      - name: No unexplained vendor key anywhere in history
        run: scripts/check-secret-history.sh --all

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev ccache

      # This workflow is now the only thing that warms the compiler cache. The
      # nightly cache-warm matrix was removed: it ran five runners a day —
      # including two macOS, billed at 10x on a private repository — and had
      # been failing since the ask lane broke the build, so it spent minutes
      # nightly to prove nothing.
      - name: Compiler cache (restore)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ci-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ci-ccache-${{ runner.os }}-
            ccache-${{ runner.os }}-

      - name: Build the product binary
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1500M
        run: |
          source scripts/env.sh
          make -j"$(nproc)" -f Makefile.hyp hyp

      # The `ask` lane's encoder is compiled in but never loaded here: no model
      # is on the runner, and the tool reports available=false rather than
      # failing. That is the behaviour worth having in CI — the binary must
      # build and start on a machine with no weights.
      - name: Version and help must work with no model present
        run: |
          ./build/c/hyponoia --version
          ./build/c/hyponoia --help > /dev/null
          ./build/c/hyponoia fetch-model --path

      # Documented counts must match the binary. The tool count had drifted to
      # four different values across seven files before this existed.
      - name: Documentation claims match the binary
        run: scripts/check-docs-claims.sh

      - name: Build and run the fast suite
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1500M
        run: |
          source scripts/env.sh
          make -j"$(nproc)" -f Makefile.hyp test-foundation
          ./build/c/test-foundation

      - name: Compiler cache (save)
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ci-ccache-${{ runner.os }}-${{ github.sha }}
