# PR validation: security gates + lint + full test suite. Builds, smoke and
# soak stay maintainer-driven via the dry-run workflow_dispatch. `ci-ok` is the
# single stable summary context that fails unless every PR stage succeeded, and
# is what branch protection would require if this plan allowed it.
# NEXT-STEPS.md §2.12 deleted the `dco` workflow that used to sit beside it:
# the sign-off is still enforced locally by scripts/git-hooks/commit-msg and
# scripts/check-dco.sh, and the server-side check existed for outside
# contributors, of whom this repository has none.
name: PR

on:
  # No automatic trigger -- same instruction as ci.yml. Runnable by hand.
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

# A new push to the PR supersedes the running validation — cancel it
# instead of stacking zombie pipelines.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true


jobs:
  security:
    uses: ./.github/workflows/_security.yml
    secrets: inherit

  lint:
    uses: ./.github/workflows/_lint.yml

  test:
    needs: [lint]
    if: ${{ !cancelled() && needs.lint.result == 'success' }}
    uses: ./.github/workflows/_test.yml
    with:
      # Perf assertions are timing-sensitive on shared runners; they stay in
      # dry runs and releases where a flaky red does not block a merge.
      skip_perf: true
      # Iteration speed: split each C-suite leg across parallel shard jobs
      # (ubuntu x3, windows x2; coverage re-proven every run by the
      # shard-completeness job). Dry runs and releases shard identically.
      shard_suites: true
      # NEXT-STEPS.md §2.12. This is a private repository: Linux bills 1x,
      # Windows 2x, macOS 10x. Before this line a single pull request to main
      # billed macos-14 twice, macos-15-intel, macos-latest and windows-latest
      # four times — one of them with a 240-minute timeout. The only
      # cross-platform claim this project makes is the one release.yml
      # attaches to a published artifact, and release.yml and dry-run.yml both
      # still run the full matrix. Proof of portability belongs there, not on
      # every Dependabot bump.
      linux_only: true

  # ── Which files changed? Gate the (heavier) build+smoke on product code so
  #    docs / CI / test-only PRs stay fast. ──
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      product: ${{ steps.f.outputs.product }}
    steps:
      - name: Detect product-code changes
        id: f
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # The full .diff endpoint rejects large-but-valid PRs at 20k lines.
          # The paginated files endpoint remains filename-only for this gate.
          FILES=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename')
          printf '%s\n' "$FILES"
          if printf '%s\n' "$FILES" | grep -qE '^(src/|internal/|install\.(sh|ps1)|scripts/build\.sh|scripts/smoke-test\.sh|scripts/smoke-local\.sh|scripts/smoke-fixture-server\.py|scripts/gen-third-party-notices\.sh|scripts/env\.sh|test-infrastructure/vm/(vm-smoke\.sh|windows-user-path-guard\.ps1)|Makefile\.hyp)'; then
            echo "product=true" >> "$GITHUB_OUTPUT"
          else
            echo "product=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Light smoke: build the PRODUCTION binary and run the core smoke. Catches
  #    built-binary regressions at PR time (e.g. the Windows CreateProcess
  #    argv-quoting class that previously only surfaced in the release dry run).
  #    The full broad/emulated smoke stays in the dry run. Only product-code PRs
  #    pay this; every leg gates.
  #    The maintained local wrappers add a race-free release fixture so the
  #    download/checksum/install/update phases run here as well.
  #
  #    NEXT-STEPS.md §2.12 cut this from [ubuntu-latest, macos-14,
  #    windows-latest] to Linux alone, and KEPT the macOS and Windows steps on
  #    the argument that "re-adding a label here is a one-line change".
  #    NEXT-STEPS.md §3.2 step 6 (2026-08-16) deleted both, because that
  #    argument stopped being true and nothing said so:
  #
  #    - RETIRED-PLATFORM(macos): macOS is retired as of 2026-08-15 — not
  #      built, not tested, not published (docs/MAINTAINERS.md "Retired
  #      platforms"; the release matrix has no darwin). There is no label to
  #      re-add. Its `codesign --sign - --force` recipe is not lost: it is held
  #      in _build.yml's own kept-macOS step, scripts/package-release.sh and
  #      install.sh.
  #    - Windows is NOT retired — windows-amd64 is a published asset — but its
  #      step here had gone stale in three ways at once while unreachable:
  #      it built without --with-ui, it invoked vm-smoke.sh with the default
  #      SMOKE_VARIANT=standard against a release that publishes ONLY `-ui`
  #      archives (the exact shape bug the Ubuntu leg was just fixed for, and
  #      which kept pr.yml red from 2026-08-14), and `--with-ui` needs node,
  #      which the msys2 install list did not carry and setup-node was guarded
  #      away from. Restoring it was three changes, not one. The MAINTAINED
  #      Windows recipe — variant `ui`, artifact mode, PATH-mutation guard — is
  #      _smoke.yml's smoke-windows, which ran green on both windows images in
  #      release run 31924848305. One recipe, one place: the two-ends rule that
  #      produced the Ubuntu fix applies to this file too.
  #
  #    What is given up is real — the argv-quoting class named above surfaces
  #    at dry-run rather than at PR — and that is the trade §2.12 accepted on a
  #    private plan where macOS bills 10x. ──
  pr-smoke:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.product == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install deps (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev ccache

      # Verified compiler cache — content-keyed, stale hits impossible by
      # construction (see scripts/env.sh).
      - name: Compiler cache (content-verified)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-smoke-${{ matrix.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-smoke-${{ matrix.os }}-${{ github.ref }}-

      # The release publishes ONLY `-ui` archives, and install.sh REFUSES
      # `--standard` by name because a standard archive has never existed under
      # this fork (see c2f1a92e). A smoke that stages a standard-named fixture
      # therefore tests a shape that does not ship, and phase 13 dies on the
      # refusal it should be asserting: `install.sh --standard` exits, no binary
      # lands, `FAIL 13b`. This is the two-ends rule applied to packaging — the
      # smoke venue has to serve what the release serves — so the PR smoke now
      # builds and smokes the UI variant, which also puts the asset pack (the
      # thing that shipped broken in v0.2.4) back under a per-PR gate.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: "22"

      - name: Build prod + smoke (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          scripts/build.sh --with-ui CC=gcc CXX=g++
          scripts/smoke-local.sh "$(pwd)/build/c/hyponoia" ui
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1000M

  # ── No compiled artifact may be tracked. NEXT-STEPS.md §3.2 step 6. ──
  #    `pkg/go/hyponoia`, a 9,428,133-byte compiled Go binary, was tracked from
  #    dd41cf92 and shipped inside the v0.3.0 AND v0.3.1 tags. Nothing looked
  #    for it; it surfaced because a grep for an unrelated sha256 matched a
  #    string in its .rodata. .gitignore now names that one path, which stops
  #    that one file — this is the gate that stops the class.
  #
  #    Its own job, not a step inside lint, deliberately: lint is 12m17s and
  #    release.yml can now skip it (skip_lint), and a gate that a release flag
  #    can switch off is not a gate. This runs in ~15s, gated on nothing, and
  #    its verdict is a required part of ci-ok.
  #
  #    ci.yml carries the same job, because this repository pushes to main
  #    directly (see ci.yml's own header) — which is exactly how dd41cf92
  #    arrived. A PR-only gate would not have caught the thing it exists for.
  tracked-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Detection before cleanliness, as with secret-history: plant a real ELF,
      # PE, Mach-O and opaque blob and require the scanner to refuse them. A
      # scanner nobody has watched fail is indistinguishable from `exit 0`.
      - name: The gate must refuse planted binaries
        run: scripts/ci/check-tracked-artifacts.sh --selftest

      - name: No tracked file may be a build artifact
        run: scripts/ci/check-tracked-artifacts.sh

  ci-ok:
    # The one required context — fails unless every PR stage
    # succeeded, so matrix renames can never silently deadlock merges. `skipped`
    # is OK: pr-smoke skips on docs/CI/test-only PRs (changes.product == false).
    #
    # Every job in this file must appear here, or its failure is invisible to
    # the only context branch protection reads. `tracked-artifacts` was added
    # with the job (NEXT-STEPS.md §3.2 step 6); nothing was removed — item 3 of
    # that step deleted dead STEPS inside pr-smoke, not the job.
    needs: [security, lint, test, changes, pr-smoke, tracked-artifacts]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Needs a checkout (unlike before): the gate logic lives in the canonical
      # scripts/ci entry, not inline YAML (venue-parity contract).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: All PR stages must have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: scripts/ci/require-all-green.sh
