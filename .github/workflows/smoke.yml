# Smoke invariants across the WIDEST set of GitHub-hosted runners. Builds the
# production source path with explicit fault-injection test seams and runs
# scripts/smoke-invariants.sh
# (version/help, MCP initialize handshake [#513], all 14 tools invocable, malformed-
# input resilience, clean EOF exit, shared-lib resolution, install dry-run).
#
# Maximizing platforms is the point: ubuntu-22.04 (older glibc → AlmaLinux/#182
# class), all arm64 variants + windows-11-arm (arch portability), multiple macOS
# and Windows versions. A FAIL on any platform is a binary users would receive.
#
# NON-GATING: workflow_dispatch only (NEXT-STEPS.md §2.12 removed the qa/smoke-**
# push trigger). The full ~10-platform build is heavy, so it is asked for rather
# than triggered.
#
# RETIRED-PLATFORM(macos) / RETIRED-PLATFORM(windows-arm64): the macOS and
# windows-11-arm legs below are LEFT IN PLACE. This board is dispatch-only and
# already tolerates red — and "does it still build on a platform we stopped
# shipping?" is precisely the question you would dispatch it to answer. It is
# not a gate, so it cannot block anything. See docs/MAINTAINERS.md
# "Retired platforms" for what those legs currently fail on.
name: Smoke (all platforms)

on:
  # NEXT-STEPS.md §2.12 removed `push: branches: ['qa/smoke-**']`. This is the
  # widest matrix in the repository — roughly ten runners including several
  # macOS at 10x and Windows at 2x on a private plan — and it was reachable by
  # pushing a branch pattern inherited from upstream that we have never used.
  # Dispatch-only, so it costs nothing until a maintainer asks for it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Unix: linux amd64+arm64 (incl. older glibc 22.04), darwin arm64+amd64 ──
  smoke-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # older glibc — AlmaLinux/#182 portability class
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - os: ubuntu-22.04-arm
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04-arm
            cc: gcc
            cxx: g++
          - os: macos-14            # arm64
            cc: cc
            cxx: c++
          - os: macos-15            # arm64
            cc: cc
            cxx: c++
          - os: macos-15-intel      # x86_64
            cc: cc
            cxx: c++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install deps (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev python3 git
      - name: Build (production path with explicit test seams)
        run: scripts/build.sh CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} TEST_SEAMS=1
      - name: Smoke invariants
        run: |
          chmod +x scripts/smoke-invariants.sh
          scripts/smoke-invariants.sh build/c/hyponoia

  # ── Windows x64: 2022 + 2025 (msys2 CLANG64) ──────────────────────────────
  smoke-windows-x64:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: CLANG64
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-python3
            make
            git
            coreutils
      - name: Build (production path with explicit test seams)
        shell: msys2 {0}
        run: scripts/build.sh CC=clang CXX=clang++ TEST_SEAMS=1
      - name: Smoke invariants
        shell: msys2 {0}
        run: |
          chmod +x scripts/smoke-invariants.sh
          BIN=build/c/hyponoia
          [ -f "${BIN}.exe" ] && BIN="${BIN}.exe"
          scripts/smoke-invariants.sh "$BIN"

  # ── Windows arm64: windows-11-arm (msys2 CLANGARM64) — experimental ───────
  # Best-effort: surfaces whether our binary builds + smokes on Windows on ARM.
  smoke-windows-arm:
    runs-on: windows-11-arm
    timeout-minutes: 240
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: CLANGARM64
          path-type: inherit
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-zlib
            mingw-w64-clang-aarch64-python3
            make
            git
            coreutils
      - name: Build (production path with explicit test seams)
        shell: msys2 {0}
        run: scripts/build.sh CC=clang CXX=clang++ TEST_SEAMS=1
      - name: Smoke invariants
        shell: msys2 {0}
        run: |
          chmod +x scripts/smoke-invariants.sh
          BIN=build/c/hyponoia
          [ -f "${BIN}.exe" ] && BIN="${BIN}.exe"
          scripts/smoke-invariants.sh "$BIN"
