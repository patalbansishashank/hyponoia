# Fast repro lane — single platform, NO sanitizers — for quick fix-iteration
# feedback (the red-count after a fix) without waiting ~15 min for the full
# 5-platform ASan board. The full bug-repro.yml board remains the comprehensive
# all-platform check; this is just the fast inner loop.
#
# Trigger: workflow_dispatch only (NEXT-STEPS.md §2.12 removed the qa/fast-**
# push trigger). Non-gating.
name: Fast Repro

on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'Comma list of suite-name substrings to run (empty = all)'
        type: string
        default: ''
  # NEXT-STEPS.md §2.12 removed `push: branches: ['qa/fast-**']`. That branch
  # pattern is upstream's and has never been pushed in this repository, so the
  # trigger was a standing automatic cost against a convention we do not use.
  # The workflow itself is kept: dispatch-only costs nothing until called, and
  # this is the fast inner loop when a repro board is actually needed.

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: test-repro (single platform, ASan; HYP_REPRO_ONLY filters suites)
        env:
          # Optionally narrow to specific suites for a fast targeted check, e.g.
          # HYP_REPRO_ONLY="repro_invariant_enclosing_parity,repro_grammar_systems".
          # Empty = run all. (No-sanitizer builds crash on some suites, so ASan
          # stays on; the single-platform run is the speedup vs the 5-platform board.)
          HYP_REPRO_ONLY: ${{ github.event.inputs.suites }}
        run: scripts/repro.sh CC=gcc CXX=g++
