name: OpenSSF Scorecard

# Restored by NEXT-STEPS.md §2.13. Deleted at 799d4c9b for the same reason as
# CodeQL: Scorecard cannot analyse a private repository, and `publish_results`
# needs a public one. Its Monday cron is the ONLY schedule in the repository —
# §2.12 removed stale.yml's daily and nightly-soak's weekly, and neither comes
# back. This one is a supply-chain rating that changes when dependencies change,
# not a bot poking a tracker nobody reads.

on:
  # No automatic trigger -- same instruction as ci.yml. Runnable by hand.
  workflow_dispatch: {}

permissions: read-all

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          sarif_file: results.sarif
